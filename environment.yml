name: ai-env
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip
  - numpy=1.26.4
  - scipy=1.11.4
  - scikit-learn=1.2.2
  - pandas=2.1.1
  - matplotlib=3.7.2
  - seaborn=0.12.2
  - ipywidgets=7.7.1

  - pip:
      # --- Deep Learning (PyTorch) ---
      - torch==2.6.0
      - torchvision==0.21.0
      - torchaudio==2.6.0

      # --- Hugging Face / Transformers ---
      - transformers>=4.46.0
      - accelerate>=0.26.0
      - tokenizers>=0.20.0
      - sentence-transformers>=3.0.0
      - safetensors>=0.4.5
      - huggingface-hub>=0.26.0

      # --- Basic Tools ---
      - regex
      - requests
      - packaging
      - pyyaml
      - filelock
      - fsspec
      - typing-extensions
      - python-dotenv==1.0.1
      - grandalf==0.8

      # --- LangChain Ecosystem (Critical Fix: Use >= to allow dependency resolution) ---
      # 这里的关键是允许 pip 自动找到互相兼容的最新版本，而不是互相打架
      - langchain>=0.3.0
      - langchain-community>=0.3.0
      - langchain-core>=0.3.29  # MCP Adapter 通常需要较新的 core
      - langchain-ollama>=0.3.0
      - langchain-text-splitters>=0.3.0
      - langchain-huggingface>=0.1.0
      - tiktoken>=0.7.0

      # --- LangGraph ---
      # 必须确保 >=0.2.28 才有 prebuilt.create_react_agent
      - langgraph>=0.2.60  
      - langgraph-checkpoint>=2.0.0

      # --- MCP Stack (The New Stuff) ---
      - mcp
      - langchain-mcp-adapters

      # --- Other Integrations ---
      - pymilvus>=2.4.0
      - openpyxl==3.1.2