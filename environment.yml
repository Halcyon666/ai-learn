name: ai-env
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip
  - numpy=1.26.4
  - scipy=1.11.4
  - scikit-learn=1.2.2
  - pandas=2.1.1
  - matplotlib=3.7.2
  - seaborn=0.12.2
  - ipywidgets=7.7.1

  - pip:
      # PyTorch
      - torch==2.6.0
      - torchvision==0.21.0
      - torchaudio==2.6.0

      # Transformers
      - transformers>=4.46.0  
      - accelerate>=0.26.0 
      - tokenizers>=0.20.0    
      - sentence-transformers>=3.0.0 
      - safetensors>=0.4.5
      - huggingface-hub>=0.26.0

      # basic tools
      - regex
      - requests
      - packaging
      - pyyaml
      - filelock
      - fsspec
      - typing-extensions

      # langchain
      - langchain==0.3.27
      - langchain-community==0.3.27
      - langchain-core==0.3.74
      - langchain-ollama==0.3.7
      - langchain-text-splitters==0.3.9
      - tiktoken==0.7.0
      - langchain-huggingface==0.1.0

      # vector db
      - pymilvus>=2.4.0

      # excel
      - openpyxl==3.1.2
