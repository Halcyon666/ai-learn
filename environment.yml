name: ai-env

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip
  - numpy=1.26.4
  - scipy=1.11.4
  - scikit-learn=1.2.2
  - pandas=2.1.1
  - matplotlib=3.7.2
  - seaborn=0.12.2
  - ipywidgets=7.7.1

  - pip:
      - torch==2.6.0
      - torchvision==0.21.0
      - torchaudio==2.6.0
      - --index-url https://download.pytorch.org/whl/cu124

      